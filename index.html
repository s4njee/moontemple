<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moon Temple</title>
    <!-- Inline, so no browser goes looking for /favicon.ico and logs a 404. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2307070f'/%3E%3Ccircle cx='8' cy='6' r='3.2' fill='%23dcd9ff'/%3E%3Ccircle cx='4' cy='11.5' r='1.6' fill='%236b5cff'/%3E%3Ccircle cx='9.5' cy='12' r='1.4' fill='%235a48f0'/%3E%3Ccircle cx='13' cy='9.5' r='1.3' fill='%236b5cff'/%3E%3C/svg%3E"
    />
    <script>
      // Before first paint, so a stored theme never flashes the other one.
      try {
        const theme = localStorage.getItem('mt-theme');
        if (theme === 'light' || theme === 'auto') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
