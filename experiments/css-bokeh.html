<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS bokeh · Moon Temple story 4.1</title>
    <!-- The look of bokeh-drift as a front-end developer would build it without WebGPU: soft discs as
         radial gradients, screen-blended so overlaps brighten, drifting up on CSS keyframes, under
         a glow for the light. Story 4.1 compares it with the shader; see docs/studies/css-bokeh.md.
         The discs are made by the script below so their layout is seeded like the effect's. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #030208;
      }
      .field {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 50% 17%, #f4f6ff 0 3.2vh, #8f86ff 4.5vh, #3a2a9a55 11vh, transparent 34vh),
          #030208;
      }
      .orb {
        position: absolute;
        border-radius: 50%;
        mix-blend-mode: screen;
        will-change: transform;
        animation: rise linear infinite;
      }
      @keyframes rise {
        from {
          transform: translateY(0);
        }
        /* One fixed travel for every disc, so the animation can stay on the compositor: a custom
           property in keyframes would make Chrome recompute style every frame. */
        to {
          transform: translateY(-120vh);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .orb {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="field" id="field"></div>
    <script>
      // Mulberry32, the same seeded generator the effect uses, so the field is the same every load.
      function random(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const r = random(31);
      const field = document.getElementById('field');
      const count = Number(new URLSearchParams(location.search).get('orbs') ?? 110);
      for (let i = 0; i < count; i++) {
        const u = -0.05 + 1.1 * r();
        r(); // the effect's starting height: here every disc starts below the view instead
        const z = 1.5 * Math.pow(20, r());
        const rise = 0.015 + 0.03 * r();
        r(); // phase: CSS keyframes do not sway
        const hue = r();
        const level = 0.09 * Math.exp(0.9 * (r() + r() + r() - 1.5));
        // The same disc size as the effect: blur at infinity times (1 - focus / depth).
        const size = 2 * 4.5 * (1 - 0.5 / z);
        const alpha = Math.min(1, level * 4.5);
        const colour = `rgb(${Math.round(255 * (0.1 + 0.16 * hue) * 0.6)} ${Math.round(255 * 0.09 * 0.6)} 255 / ${alpha.toFixed(3)})`;
        const rim = `rgb(${Math.round(255 * (0.1 + 0.16 * hue) * 0.6)} ${Math.round(255 * 0.09 * 0.6)} 255 / ${Math.min(1, alpha * 1.35).toFixed(3)})`;
        // The effect's speed: `rise` image heights a second at 1 m, divided by depth.
        const duration = 1.2 / (rise / z);
        const orb = document.createElement('div');
        orb.className = 'orb';
        Object.assign(orb.style, {
          left: `calc(${(u * 100).toFixed(2)}vw - ${(size / 2).toFixed(2)}vh)`,
          top: '101vh',
          width: `${size.toFixed(2)}vh`,
          height: `${size.toFixed(2)}vh`,
          background: `radial-gradient(circle, ${colour} 0 62%, ${rim} 88%, transparent 100%)`,
          animationDuration: `${duration.toFixed(1)}s`,
          // Spread over its own loop, so the field starts full and stays even.
          animationDelay: `-${(r() * duration).toFixed(1)}s`,
        });
        field.append(orb);
      }
    </script>
  </body>
</html>
