<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSS fallbacks · Moon Temple story 7.4</title>
    <!--
      Story 7.4: every Tier A effect beside its best CSS version (src/fallbacks/), with what the
      CSS cannot do and the verdict. The left of each row is the effect's poster, or the live
      effect where it has no poster yet; the right is the CSS, live.
        ?only=<id>    that effect's CSS version alone, filling the window (for
                      experiments/css-fallbacks-cost.mjs); ?only=none is an empty page
        ?still        every CSS animation held, as under prefers-reduced-motion
        ?live         the live effect on the left of every row instead of the poster
    -->
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        --bg: #08080d;
        --panel: #12121b;
        --line: #26263a;
        --text: #e6e3f5;
        --muted: #9a97b0;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      body.only {
        overflow: hidden;
      }
      .only-stage {
        position: fixed;
        inset: 0;
      }
      main {
        max-width: 1240px;
        margin: 0 auto;
        padding: 24px 16px 64px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 6px;
      }
      .lede {
        color: var(--muted);
        margin: 0 0 24px;
        max-width: 80ch;
        line-height: 1.5;
        font-size: 14px;
      }
      .row {
        border-top: 1px solid var(--line);
        padding: 18px 0 22px;
      }
      .row h2 {
        font-size: 16px;
        margin: 0 0 10px;
        display: flex;
        gap: 10px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .row h2 code {
        color: var(--muted);
        font-weight: 400;
        font-size: 13px;
      }
      .pill {
        font-size: 12px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
        background: #26324a;
        color: #bcd2ff;
      }
      .pill.poster {
        background: #3a2c1c;
        color: #ffd8a8;
      }
      .pill.none {
        background: #2a2a2a;
        color: #cfcfcf;
      }
      .pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      @media (max-width: 720px) {
        .pair {
          grid-template-columns: 1fr;
        }
      }
      figure {
        margin: 0;
      }
      .frame {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid var(--line);
      }
      .frame > img,
      .frame > iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        object-fit: cover;
      }
      .frame .reason {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
        background: var(--panel);
      }
      figcaption {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
      }
      .cannot {
        margin: 10px 0 0;
        font-size: 13px;
        line-height: 1.5;
        max-width: 110ch;
      }
      .cannot strong {
        color: #ffcfa0;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./css-fallbacks.ts"></script>
  </body>
</html>
