<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS rack focus · Moon Temple story 6.8</title>
    <!-- The rack-focus transition as a front-end developer would build it without WebGPU: two
         sections stacked, `filter: blur()` rising to a peak at the cut and falling again, the
         incoming section faded in over the outgoing one around the cut. The same two views as the
         effect's demo (a night-market hero and a gallery of three city photos), the same loop
         (hold 2 s, rack 1.2 s, hold, rack back) and the same blur curve, with the Gaussian's
         standard deviation set to half the hexagon's radius. Story 6.8 compares the two; see
         experiments/css-rack-focus.mjs and src/effects/rack-focus-transition/notes.md.

           ?mode=stack   one blur on the stack of both views (the default, and the cheaper)
           ?mode=each    the same blur on each view separately
           ?mode=none    no transition: the hero, still (the cost floor)
           ?at=2.6       paused at 2.6 s into the loop, for screenshots
           ?blur=4       peak blur as the effect's percent of the view height

         Under prefers-reduced-motion the views simply cut, with no blur. -->
    <style>
      :root {
        --cycle: 6.4s;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: system-ui, sans-serif;
      }
      .stage,
      .view {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      .view > * {
        position: absolute;
      }
      .lamp {
        border-radius: 50%;
      }
      .word {
        border-radius: 0.3vh;
      }
      h1 {
        margin: 0;
        font-size: 9vh;
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        font-size: 2.2vh;
        line-height: 1.45;
      }
      .button {
        border-radius: 4vh;
        padding: 1.6vh 4vh;
        font-size: 2.2vh;
        font-weight: 700;
        text-decoration: none;
      }

      /* The rack (@keyframes rack) is written by the script with the blur as a number: a custom
         property inside keyframes would keep the animation off the compositor. */
      /* The incoming view over the outgoing one: faded in across the middle 40% of each rack. */
      @keyframes fade {
        0%,
        36.875% {
          opacity: 0;
          animation-timing-function: ease-in-out;
        }
        44.375%,
        86.875% {
          opacity: 1;
          animation-timing-function: ease-in-out;
        }
        94.375%,
        100% {
          opacity: 0;
        }
      }
      @keyframes cut {
        0%,
        40.625% {
          opacity: 0;
        }
        40.626%,
        90.625% {
          opacity: 1;
        }
        90.626%,
        100% {
          opacity: 0;
        }
      }
      .stack .stage,
      .each .view {
        animation: rack var(--cycle) linear infinite;
      }
      .stack #b,
      .each #b {
        animation:
          rack var(--cycle) linear infinite,
          fade var(--cycle) linear infinite;
      }
      .stack #b {
        animation: fade var(--cycle) linear infinite;
      }
      .none #b {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .stack .stage,
        .each .view {
          animation: none;
        }
        .stack #b,
        .each #b {
          animation: cut var(--cycle) linear infinite;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <section class="view" id="a" aria-label="Hero"></section>
      <section class="view" id="b" aria-label="Gallery"></section>
    </div>
    <script>
      const query = new URLSearchParams(location.search);
      const mode = query.get('mode') ?? 'stack';
      document.body.className = mode;
      const peak = Number(query.get('blur') ?? 4);
      // The effect's blur is a hexagon of circumradius r; a Gaussian of deviation r / 2 looks as soft.
      // The loop is hold 2 s (0 to 31.25%), rack 1.2 s (to 50%), hold, rack back. The blur peaks in
      // the middle of each rack; ease-in-out between stops is the effect's smoothstep.
      const sigma = `${(0.5 * peak).toFixed(2)}vh`;
      const keyframes = document.createElement('style');
      keyframes.textContent = `@keyframes rack {
        0%, 31.25%, 50%, 81.25%, 100% { filter: blur(0); animation-timing-function: ease-in-out; }
        40.625%, 90.625% { filter: blur(${sigma}); animation-timing-function: ease-in-out; }
      }`;
      document.head.append(keyframes);
      if (query.has('at')) {
        const at = `-${Number(query.get('at'))}s`;
        for (const el of [
          document.getElementById('stage'),
          ...document.querySelectorAll('.view'),
        ]) {
          el.style.animationDelay = `${at}, ${at}`;
          el.style.animationPlayState = 'paused';
        }
      }

      // Mulberry32: a seeded layout, the same every load.
      function random(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      /** Linear RGB, 0..1, as a CSS colour. */
      const srgb = (c, alpha = 1) => {
        const e = (x) => {
          const v = Math.min(1, Math.max(0, x));
          return Math.round(255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055));
        };
        return `rgb(${e(c[0])} ${e(c[1])} ${e(c[2])} / ${alpha})`;
      };
      // Positions in view heights from the centre, y down, as the shader has them.
      const X = (x) => `calc(50vw + ${(100 * x).toFixed(3)}vh)`;
      const Y = (y) => `calc(50vh + ${(100 * y).toFixed(3)}vh)`;
      const H = (h) => `${(100 * h).toFixed(3)}vh`;
      function add(parent, style, className = '', text = '') {
        const el = document.createElement(className === 'button' ? 'a' : 'div');
        if (className) el.className = className;
        if (text) el.textContent = text;
        Object.assign(el.style, style);
        parent.append(el);
        return el;
      }
      function lamp(parent, x, y, r, colour) {
        const core = colour.map((v) => v + (1 - v) * 0.7);
        add(
          parent,
          {
            left: X(x - r),
            top: Y(y - r),
            width: H(2 * r),
            height: H(2 * r),
            background: `radial-gradient(circle, ${srgb(core)} 0 35%, ${srgb(colour)} 90%, ${srgb(colour, 0)} 100%)`,
            boxShadow: `0 0 ${H(3 * r)} ${H(r)} ${srgb(colour, 0.12)}`,
          },
          'lamp',
        );
      }
      const WARM = [
        [1, 0.62, 0.24],
        [1, 0.82, 0.45],
        [1, 0.46, 0.42],
      ];

      function hero(view, aspect) {
        const r = random(7);
        view.style.background = `linear-gradient(${srgb([0.005, 0.005, 0.026])}, ${srgb([0.03, 0.013, 0.05])})`;
        for (let i = 0; i < 160; i++) {
          const x = (r() - 0.5) * aspect;
          const y = -0.5 + 0.7 * r();
          const level = r() ** 6;
          add(view, {
            left: X(x),
            top: Y(y),
            width: H(0.0032),
            height: H(0.0032),
            borderRadius: '50%',
            background: srgb([0.85, 0.9, 1], level.toFixed(3)),
          });
        }
        const moon = [Math.min(0.3 * aspect, 0.6), -0.1];
        add(view, {
          left: X(moon[0] - 0.075),
          top: Y(moon[1] - 0.075),
          width: H(0.15),
          height: H(0.15),
          borderRadius: '50%',
          background: `radial-gradient(circle at 35% 38%, ${srgb([0.69, 0.68, 0.63])} 0 18%, transparent 19%), radial-gradient(circle at 66% 62%, ${srgb([0.73, 0.71, 0.67])} 0 13%, transparent 14%), ${srgb([0.79, 0.77, 0.72])}`,
          boxShadow: `0 0 ${H(0.2)} ${H(0.04)} ${srgb([0.05, 0.045, 0.08])}`,
        });
        for (const [top, sag, count, seed] of [
          [-0.47, 0.1, 30, 0],
          [-0.5, 0.2, 38, 1],
        ]) {
          const half = 0.5 * aspect + 0.02;
          for (let i = 0; i <= count; i++) {
            const s = i / count;
            const y = top + sag * (1 - (2 * s - 1) ** 2) + 0.01;
            lamp(view, -half + s * 2 * half, y, 0.0055, WARM[(i * 7 + seed) % 3]);
          }
        }
        const left = -Math.min(0.5 * aspect, 0.92) + 0.12;
        add(view, { left: X(left), top: Y(-0.165), color: srgb([0.82, 0.8, 0.88]) }, '', '');
        const title = view.lastChild;
        title.innerHTML = '<h1>Night market,<br />after dark</h1>';
        add(
          view,
          { left: X(left), top: Y(0.03), width: H(0.6), color: srgb([0.26, 0.25, 0.32]) },
          '',
          '',
        ).innerHTML =
          '<p>Forty stalls under the lanterns, open from dusk until the last bowl of noodles. Bring cash and an appetite.</p>';
        add(
          view,
          {
            left: X(left),
            top: Y(0.137),
            background: srgb([0.86, 0.36, 0.07]),
            color: srgb([0.06, 0.02, 0]),
          },
          'button',
          'Find a stall',
        ).href = '#';
        const pitch = 0.16;
        const half = 0.5 * aspect;
        for (let s = Math.floor(-half / pitch) - 1; s <= half / pitch; s++) {
          const x0 = (s + 0.5) * pitch;
          const roof = 0.33 + 0.04 * random(100 + s)();
          add(view, {
            left: X(x0 - pitch / 2),
            top: Y(roof),
            width: H(pitch),
            height: H(0.5),
            background: `linear-gradient(${srgb([0.072, 0.038, 0.024])}, ${srgb([0.012, 0.008, 0.014])} ${H(0.12)})`,
            clipPath: `polygon(0 ${H(0.35 * pitch * 0.5)}, 50% 0, 100% ${H(0.35 * pitch * 0.5)}, 100% 100%, 0 100%)`,
          });
          for (const j of [-1, 0, 1]) {
            lamp(
              view,
              x0 + j * 0.045,
              roof + 0.35 * Math.abs(j * 0.045) + 0.022,
              0.0065,
              WARM[(((s * 3 + j) % 3) + 3) % 3],
            );
          }
        }
      }

      function gallery(view, aspect) {
        view.style.background = `linear-gradient(${srgb([0.003, 0.014, 0.018])}, ${srgb([0.008, 0.03, 0.034])})`;
        const left = -Math.min(0.5 * aspect, 0.92) + 0.12;
        add(
          view,
          {
            left: X(left),
            top: Y(-0.405),
            color: srgb([0.78, 0.9, 0.88]),
            fontSize: H(0.06),
            fontWeight: 800,
          },
          '',
          'Cities at night',
        );
        add(
          view,
          { left: X(left), top: Y(-0.325), color: srgb([0.22, 0.28, 0.3]), fontSize: H(0.022) },
          '',
          'Three photographs from the market’s sister towns, taken from the roofs.',
        );
        const pitch = (-2 * left) / 3;
        const tints = [
          [0.3, 0.85, 1],
          [1, 0.32, 0.78],
          [1, 0.7, 0.3],
        ];
        for (let card = 0; card < 3; card++) {
          const r = random(40 + card);
          const centre = [left + (card + 0.5) * pitch, 0.06];
          const half = [0.44 * pitch, 0.27];
          const box = add(view, {
            left: X(centre[0] - half[0]),
            top: Y(centre[1] - half[1]),
            width: H(2 * half[0]),
            height: H(2 * half[1]),
            borderRadius: H(0.02),
            background: srgb([0.012, 0.02, 0.024]),
            border: `${H(0.0024)} solid ${srgb([0.05, 0.07, 0.075])}`,
            boxSizing: 'border-box',
          });
          const size = [2 * half[0] - 0.032, 0.36];
          const image = add(box, {
            position: 'absolute',
            left: H(0.016),
            top: H(0.016),
            width: H(size[0]),
            height: H(size[1]),
            overflow: 'hidden',
            background: `linear-gradient(${srgb([0.008, 0.01, 0.035])}, ${srgb(tints[card].map((v) => v * 0.08))})`,
          });
          const width = 0.034;
          for (let c = 0; c * width < size[0]; c++) {
            const top = size[1] * (0.2 + 0.5 * r());
            add(image, {
              position: 'absolute',
              left: H(c * width),
              top: H(top),
              width: H(width),
              height: H(size[1] - top),
              background: srgb([0.006, 0.006, 0.01]),
            });
            for (let y = top; y < size[1]; y += 0.0105) {
              for (let x = c * width; x < (c + 1) * width - 0.005; x += 0.0105) {
                if (r() < 0.6) continue;
                const level = 0.18 + 0.82 * r() ** 3;
                add(image, {
                  position: 'absolute',
                  left: H(x + 0.0025),
                  top: H(y + 0.0018),
                  width: H(0.0056),
                  height: H(0.0068),
                  background: srgb([level, 0.78 * level, 0.48 * level]),
                });
              }
            }
          }
          for (let i = 0; (i + 0.5) * 0.055 < size[0]; i++) {
            const x = (i + 0.5) * 0.055;
            const y = size[1] - 0.035 - 0.012 * r();
            const core = tints[card].map((v) => v + (1 - v) * 0.7);
            add(image, {
              position: 'absolute',
              left: H(x - 0.006),
              top: H(y - 0.006),
              width: H(0.012),
              height: H(0.012),
              borderRadius: '50%',
              background: `radial-gradient(circle, ${srgb(core)} 0 35%, ${srgb(tints[card])} 90%, transparent 100%)`,
              boxShadow: `0 0 ${H(0.018)} ${H(0.006)} ${srgb(tints[card], 0.12)}`,
            });
          }
          add(
            box,
            {
              position: 'absolute',
              left: H(0.016),
              top: H(0.016 + size[1] + 0.02),
              color: srgb([0.7, 0.82, 0.8]),
              fontSize: H(0.026),
              fontWeight: 700,
            },
            '',
            ['Harbour', 'Old town', 'Station'][card],
          );
          add(
            box,
            {
              position: 'absolute',
              left: H(0.016),
              top: H(0.016 + size[1] + 0.06),
              color: srgb([0.2, 0.26, 0.28]),
              fontSize: H(0.016),
            },
            '',
            'From the roof of the night market, 11 pm.',
          );
        }
      }

      function build() {
        const aspect = innerWidth / innerHeight;
        for (const id of ['a', 'b']) document.getElementById(id).replaceChildren();
        hero(document.getElementById('a'), aspect);
        gallery(document.getElementById('b'), aspect);
      }
      build();
      addEventListener('resize', build);
    </script>
  </body>
</html>
